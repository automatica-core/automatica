version: '3'
 
services:
  automatica:
    build:
      context:  ../src/automatica.core
      dockerfile: Dockerfile
      args:
        - VERSION=${AUTOMATICA_VERSION:-10.0.0.0}
        - CLOUD_URL=${CLOUD_URL:-https://cloud-dev.automaticacore.com}
        - AUTOMATICA_CLOUD_ENVIRONMENT=${AUTOMATICA_CLOUD_ENVIRONMENT:-develop}
      # export CLOUD_API_KEY=... before "docker compose build"; never as a build arg
      secrets:
        - cloud_api_key
    ports:
      - "5001:5001"
      - "1883:1883"
      - "5000:5000"
 
  proxy:
    build:
      context:  ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
    links:
      - automatica

secrets:
  cloud_api_key:
    environment: CLOUD_API_KEY
