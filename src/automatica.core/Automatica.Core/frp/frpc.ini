# [common] is integral section
[common]
admin_addr = 127.0.0.1
admin_port = {{ .Envs.ADMIN_PORT }}
admin_user = {{ .Envs.ADMIN_USER }}
admin_pwd = {{ .Envs.ADMIN_PWD }}

server_addr = {{ .Envs.REMOTE_URL }}
server_port = {{ .Envs.REMOTE_PORT }}

log_file = {{ .Envs.LOG_FILE }}
log_level = {{ .Envs.LOG_LEVEL }}

user = {{ .Envs.FRPC_USERNAME }}
# empty for frps servers without token auth
token = {{ .Envs.FRPS_TOKEN }}
meta_apikey = {{ .Envs.FRPC_APIKEY }}

includes=./enabled/*.ini
