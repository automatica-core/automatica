<button type="button" class="switch-button" [class.is-on]="state" [attr.aria-pressed]="!!state" [disabled]="disabled"
  (click)="switch($event, !state)">
  <span class="switch-dot" aria-hidden="true"></span>
  <span>{{ (state ? 'COMMON.SWITCH.OFF' : 'COMMON.SWITCH.ON') | translateAsync }}</span>
</button>
