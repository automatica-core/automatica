@if (!state) {
  <dx-button class="switch-button" type="normal" text="{{ 'COMMON.SWITCH.ON' | translateAsync }}" (onClick)="switch($event, true)" [disabled]="disabled"></dx-button>
}

@if (state) {
  <dx-button class="switch-button" type="normal" text="{{ 'COMMON.SWITCH.OFF' | translateAsync }}" (onClick)="switch($event, false)" [disabled]="disabled">
  </dx-button>
}
