<app-visualization-control [width]="2" [useFullContainer]="true" [showIcon]="false">
  <div control_full class="media" [class.has-art]="!!albumArt" [class.is-playing]="isPlaying" role="group"
    [attr.aria-label]="displayText">
    @if (albumArt) {
      <div class="media-art" aria-hidden="true" [style.background-image]="'url(' + albumArt + ')'"></div>
    }

    <div class="media-head">
      <span class="media-ico" aria-hidden="true"><fa-icon icon="music"></fa-icon></span>
      <div class="media-names">
        @if (location && location !== displayText) {
          <div class="media-room">{{ location }}</div>
        }
        <div class="media-name">{{ displayText }}</div>
      </div>
    </div>

    <div class="media-track" aria-live="polite">
      <div class="media-title">{{ title || ('UI.VISU.NOTHING_PLAYING' | translateAsync) }}</div>
      @if (creator || album) {
        <div class="media-meta">{{ creator }}@if (creator && album) { · }{{ album }}</div>
      }
    </div>

    <div class="media-controls">
      <button type="button" class="media-btn" [disabled]="!prevOutput?.IsLinked" (click)="prevCick()"
        [attr.aria-label]="'UI.VISU.PREVIOUS' | translateAsync" [attr.title]="'UI.VISU.PREVIOUS' | translateAsync">
        <fa-icon icon="backward-step"></fa-icon>
      </button>
      <button type="button" class="media-btn is-primary" (click)="playPauseClick($event)" [attr.aria-pressed]="!!isPlaying"
        [attr.aria-label]="'UI.VISU.PLAY_PAUSE' | translateAsync" [attr.title]="(isPlaying ? 'UI.VISU.PAUSE' : 'UI.VISU.PLAY') | translateAsync">
        <fa-icon [icon]="isPlaying ? 'pause' : 'play'"></fa-icon>
      </button>
      <button type="button" class="media-btn" [disabled]="!nextOutput?.IsLinked" (click)="nextClick()"
        [attr.aria-label]="'UI.VISU.NEXT' | translateAsync" [attr.title]="'UI.VISU.NEXT' | translateAsync">
        <fa-icon icon="forward-step"></fa-icon>
      </button>

      <div class="media-volume">
        <fa-icon icon="volume-low" aria-hidden="true"></fa-icon>
        <dx-slider class="media-volume-slider" [min]="0" [max]="100" [(value)]="volume" [disabled]="!volumeOutput?.IsLinked"
          (onValueChanged)="onVolumeSliderChanged($event)" valueChangeMode="onHandleRelease"
          [elementAttr]="{ 'aria-label': ('UI.VISU.VOLUME' | translateAsync) }">
          <dxo-tooltip [enabled]="true" [format]="format"></dxo-tooltip>
        </dx-slider>
      </div>
    </div>
  </div>
</app-visualization-control>
