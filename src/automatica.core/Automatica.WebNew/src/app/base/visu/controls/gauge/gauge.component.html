<app-visualization-control [hint]="displayText" [location]="location" [showIcon]="false">

  <div control class="gauge-wrap" [class.is-linear]="type == GaugeType.Linear" role="meter" [attr.aria-valuenow]="value"
    [attr.aria-valuemin]="scaleStart" [attr.aria-valuemax]="scaleEnd" [attr.aria-label]="displayText">
    @if (type == GaugeType.Circular) {
      <dx-circular-gauge class="gauge" [value]="value">
        <dxo-size [height]="gaugeHeight"></dxo-size>
        <dxo-animation [enabled]="animate"></dxo-animation>
        <dxo-value-indicator type="rangeBar" [offset]="0" [size]="8"></dxo-value-indicator>
        <dxo-geometry [startAngle]="180" [endAngle]="0"></dxo-geometry>
        <dxo-scale [startValue]="scaleStart" [endValue]="scaleEnd" [minorTickInterval]="ticks">
          <dxo-tick [visible]="false"></dxo-tick>
          <dxo-minor-tick [visible]="false"></dxo-minor-tick>
          <dxo-label [indentFromTick]="4">
            <dxo-font family="IBM Plex Mono, ui-monospace, Consolas, monospace" [size]="10"></dxo-font>
          </dxo-label>
        </dxo-scale>
        <dxo-range-container [offset]="0" [width]="8"></dxo-range-container>
      </dx-circular-gauge>
    }
    @if (type == GaugeType.Linear) {
      <dx-linear-gauge class="gauge" [value]="value">
        <dxo-size [height]="linearHeight"></dxo-size>
        <dxo-animation [enabled]="animate"></dxo-animation>
        <dxo-value-indicator type="rangeBar" [offset]="0" [size]="8"></dxo-value-indicator>
        <dxo-scale [startValue]="scaleStart" [endValue]="scaleEnd" [minorTickInterval]="ticks">
          <dxo-tick [visible]="false"></dxo-tick>
          <dxo-minor-tick [visible]="false"></dxo-minor-tick>
          <dxo-label [indentFromTick]="-14">
            <dxo-font family="IBM Plex Mono, ui-monospace, Consolas, monospace" [size]="10"></dxo-font>
          </dxo-label>
        </dxo-scale>
        <dxo-range-container [offset]="0" [width]="8"></dxo-range-container>
      </dx-linear-gauge>
    }
    <div class="gauge-value" aria-hidden="true">{{ formattedValue }}</div>
  </div>

</app-visualization-control>
