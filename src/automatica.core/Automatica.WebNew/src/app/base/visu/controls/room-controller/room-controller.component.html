<app-visualization-control [hint]="displayText" [location]="location" [icon]="roomIcon" [value]="currentText" unit="°C"
  [state]="modeText" [subValue]="subText" [active]="active">

  <div control class="room-row">
    <button type="button" class="room-btn" (click)="adjust(-1)" [disabled]="!canAdjust"
      [attr.aria-label]="('UI.VISU.ROOM_COOLER' | translateAsync) + ': ' + displayText" [attr.title]="'UI.VISU.ROOM_COOLER' | translateAsync">
      <fa-icon icon="minus"></fa-icon>
    </button>
    <span class="room-target" aria-live="polite">{{ targetText }}<small>°C</small></span>
    <button type="button" class="room-btn" (click)="adjust(1)" [disabled]="!canAdjust"
      [attr.aria-label]="('UI.VISU.ROOM_WARMER' | translateAsync) + ': ' + displayText" [attr.title]="'UI.VISU.ROOM_WARMER' | translateAsync">
      <fa-icon icon="plus"></fa-icon>
    </button>
  </div>

</app-visualization-control>
