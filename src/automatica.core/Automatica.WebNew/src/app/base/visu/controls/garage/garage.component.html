<app-visualization-control [hint]="displayText" [location]="location" [icon]="garageIcon" [active]="state !== 0"
  [state]="(stateText | translateAsync) + (moving || state === 2 ? ' · ' + positionText : '')"
  [level]="position" levelTone="accent" [hasPopup]="true">

  <div control class="garage-row">
    @if (locked) {
      <span class="garage-lock" [attr.title]="'UI.VISU.GARAGE.LOCKED' | translateAsync"><fa-icon icon="lock"></fa-icon></span>
    }
    <span class="garage-spacer"></span>
    <button type="button" class="garage-btn" (click)="open()" [disabled]="!openInput || locked"
      [attr.aria-label]="('UI.VISU.GARAGE.DO_OPEN' | translateAsync) + ': ' + displayText" [attr.title]="'UI.VISU.GARAGE.DO_OPEN' | translateAsync">
      <fa-icon icon="chevron-up"></fa-icon>
    </button>
    <button type="button" class="garage-btn" (click)="stop()" [disabled]="!stopInput"
      [attr.aria-label]="('UI.VISU.GARAGE.DO_STOP' | translateAsync) + ': ' + displayText" [attr.title]="'UI.VISU.GARAGE.DO_STOP' | translateAsync">
      <fa-icon icon="stop"></fa-icon>
    </button>
    <button type="button" class="garage-btn" (click)="close()" [disabled]="!closeInput || locked"
      [attr.aria-label]="('UI.VISU.GARAGE.DO_CLOSE' | translateAsync) + ': ' + displayText" [attr.title]="'UI.VISU.GARAGE.DO_CLOSE' | translateAsync">
      <fa-icon icon="chevron-down"></fa-icon>
    </button>
  </div>

  <div popup class="garage-popup">
    <svg class="garage-door" viewBox="0 0 120 84" role="img" [attr.aria-label]="(stateText | translateAsync) + ', ' + positionText"
      [class.is-moving]="moving">
      <!-- ground -->
      <line class="ground" x1="4" y1="80" x2="116" y2="80"></line>

      @if (isGarage) {
        <path class="frame" d="M14 80 V30 L60 8 L106 30 V80"></path>
        <rect class="opening" x="22" y="25" width="76" height="55"></rect>
        <g class="panel">
          <rect class="door" x="22" y="25" width="76" [attr.height]="doorHeight"></rect>
          @for (line of [1, 2, 3, 4]; track line) {
            @if (line * 11 < doorHeight) {
              <line class="seam" x1="22" x2="98" [attr.y1]="25 + doorHeight - line * 11" [attr.y2]="25 + doorHeight - line * 11"></line>
            }
          }
        </g>
      }

      @if (isSliding) {
        <defs>
          <clipPath [attr.id]="'garage-clip-' + item?.ObjId">
            <rect x="14" y="20" width="92" height="60"></rect>
          </clipPath>
        </defs>
        <g [attr.clip-path]="'url(#garage-clip-' + item?.ObjId + ')'">
          <g class="panel" [attr.transform]="'translate(' + slideOffset + ' 0)'">
            <rect class="door" x="16" y="32" width="88" height="44"></rect>
            @for (bar of [1, 2, 3, 4, 5, 6, 7]; track bar) {
              <line class="seam" [attr.x1]="16 + bar * 11" [attr.x2]="16 + bar * 11" y1="32" y2="76"></line>
            }
          </g>
        </g>
        <rect class="post" x="8" y="22" width="7" height="58"></rect>
        <rect class="post" x="105" y="22" width="7" height="58"></rect>
      }

      @if (isSwing) {
        <rect class="post" x="8" y="22" width="7" height="58"></rect>
        <rect class="post" x="105" y="22" width="7" height="58"></rect>
        <g class="panel" [attr.transform]="'translate(15 0) scale(' + wingScale + ' 1)'">
          <rect class="door" x="0" y="32" width="44.5" height="44"></rect>
          <line class="seam" x1="0" y1="54" x2="44.5" y2="54"></line>
        </g>
        <g class="panel" [attr.transform]="'translate(105 0) scale(' + (-wingScale) + ' 1)'">
          <rect class="door" x="0" y="32" width="44.5" height="44"></rect>
          <line class="seam" x1="0" y1="54" x2="44.5" y2="54"></line>
        </g>
      }
    </svg>

    @if (locked) {
      <div class="garage-locked"><fa-icon icon="lock"></fa-icon> {{ 'UI.VISU.GARAGE.LOCKED' | translateAsync }}</div>
    }

    <div class="garage-actions">
      <button type="button" class="garage-btn is-large" (click)="open()" [disabled]="!openInput || locked">
        <fa-icon icon="chevron-up"></fa-icon> {{ 'UI.VISU.GARAGE.DO_OPEN' | translateAsync }}
      </button>
      <button type="button" class="garage-btn is-large" (click)="stop()" [disabled]="!stopInput">
        <fa-icon icon="stop"></fa-icon> {{ 'UI.VISU.GARAGE.DO_STOP' | translateAsync }}
      </button>
      <button type="button" class="garage-btn is-large" (click)="close()" [disabled]="!closeInput || locked">
        <fa-icon icon="chevron-down"></fa-icon> {{ 'UI.VISU.GARAGE.DO_CLOSE' | translateAsync }}
      </button>
      @if (partialPosition > 0) {
        <button type="button" class="garage-btn is-large" (click)="partialOpen()" [disabled]="!partialInput || locked">
          <fa-icon icon="person-walking"></fa-icon> {{ 'UI.VISU.GARAGE.DO_PARTIAL' | translateAsync }} ({{ partialPosition }} %)
        </button>
      }
    </div>
  </div>

</app-visualization-control>
