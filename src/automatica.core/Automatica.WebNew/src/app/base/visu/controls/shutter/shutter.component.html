<app-visualization-control [hint]="displayText" [state]="displayValue" [icon]="shutterIcon" [location]="location">

  <div control class="shutter-row">
    <div class="shutter-position" aria-hidden="true"><i [style.width.%]="positionWidth"></i></div>
    <button type="button" class="shutter-btn" (click)="moveUp($event)" [disabled]="!upInput"
      [attr.aria-label]="('UI.VISU.SHUTTER_UP' | translateAsync) + ': ' + displayText" [attr.title]="'UI.VISU.SHUTTER_UP' | translateAsync">
      <fa-icon icon="chevron-up"></fa-icon>
    </button>
    <button type="button" class="shutter-btn" (click)="moveDown($event)" [disabled]="!downInput"
      [attr.aria-label]="('UI.VISU.SHUTTER_DOWN' | translateAsync) + ': ' + displayText" [attr.title]="'UI.VISU.SHUTTER_DOWN' | translateAsync">
      <fa-icon icon="chevron-down"></fa-icon>
    </button>
  </div>

</app-visualization-control>
