<app-visualization-control [hint]="displayText" [location]="location" [showIcon]="false">

  <div control class="gauge-wrap" role="meter" [attr.aria-valuenow]="value" [attr.aria-valuemin]="firstScaleStart"
    [attr.aria-valuemax]="thirdScaleEnd" [attr.aria-label]="displayText">
    <dx-circular-gauge class="gauge" [value]="value">
      <dxo-size [height]="gaugeHeight"></dxo-size>
      <dxo-animation [enabled]="animate"></dxo-animation>
      <dxo-value-indicator type="triangleMarker" [offset]="-2" [length]="9" [width]="10"></dxo-value-indicator>
      <dxo-geometry [startAngle]="180" [endAngle]="0"></dxo-geometry>
      <dxo-scale [minorTickInterval]="ticks" [startValue]="firstScaleStart" [endValue]="thirdScaleEnd">
        <dxo-tick [visible]="false"></dxo-tick>
        <dxo-minor-tick [visible]="false"></dxo-minor-tick>
        <dxo-label [useRangeColors]="true" [indentFromTick]="4">
          <dxo-font family="IBM Plex Mono, ui-monospace, Consolas, monospace" [size]="10"></dxo-font>
        </dxo-label>
      </dxo-scale>
      <dxo-range-container [offset]="4" [width]="7">
        <dxi-range [startValue]="firstScaleStart" [endValue]="firstScaleEnd" [color]="firstColor"></dxi-range>
        <dxi-range [startValue]="secondScaleStart" [endValue]="secondScaleEnd" [color]="secondColor"></dxi-range>
        <dxi-range [startValue]="thirdScaleStart" [endValue]="thirdScaleEnd" [color]="thirdColor"></dxi-range>
      </dxo-range-container>
    </dx-circular-gauge>
    <div class="gauge-value" aria-hidden="true">{{ formattedValue }}</div>
  </div>

</app-visualization-control>
