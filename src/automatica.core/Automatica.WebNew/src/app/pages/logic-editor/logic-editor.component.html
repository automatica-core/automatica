<div class="content-block">
  <div class="dx-card wide-card panel-height">
    @if (ruleTemplates) {
      <p3-config-menu #configMenu (onRestart)="restart($event)" (onDelete)="delete($event)"
        [showRuleMenu]="true" [ruleTemplates]="ruleTemplates" (onAddRule)="addRule($event)"
        (onAddRulePage)="addRulePage($event)" (onRemoveRulePage)="removeRulePage($event)"
        (onImportData)="onImportData($event)" [(selectedItem)]="selectedItem" (onZoomIn)="onZoomIn($event)"
        (onZoomOut)="onZoomOut($event)" (onZoomToView)="onZoomToView($event)" [isLoading]="isLoading">
      </p3-config-menu>
    }

    <as-split [direction]="viewport.splitDirection" class="workspace" [gutterSize]="6">
      <as-split-area [size]="22" [minSize]="14">

        <dx-tab-panel class="h-100" itemTitleTemplate="title">
          <dxi-item title="COMMON.CONFIGURATION" icon="cogs">
            <div *dxTemplate>
              <p3-config-tree class="h-100" #configTree (onNodeSelect)="nodeSelect($event)"
                [isLoading]="isLoading" [loaded]="loaded" [loadLogicNodeInstances]="true"
                (onLogicNodeInstanceRemoved)="onLogicNodeInstanceRemoved($event)">
              </p3-config-tree>
            </div>
          </dxi-item>
          <dxi-item title="COMMON.LOGIC_PAGES" icon="play">
            <div *dxTemplate>
              @if (!loaded) {
                <div class="pages-skeleton">
                  <app-skeleton variant="lines" [rows]="6"></app-skeleton>
                </div>
              } @else {
                <dx-list #logicPagesList [dataSource]="pagesDataSource" [selectedItems]="[selectedPage]"
                  height="100%" selectionMode="single"
                  (onSelectionChanged)="onTabSelectionChanged($event)">
                  <div *dxTemplate="let page of 'item'">
                    <span>{{page.Name}}</span>
                  </div>
                </dx-list>
              }
            </div>
          </dxi-item>
          <div *dxTemplate="let item of 'title'">
            <span title="{{item.title | translateAsync}}" class="nav-padding">
              <fa-icon title="{{item.title | translateAsync}}" [fixedWidth]="true" [icon]="item.icon">
              </fa-icon>
            {{ item.title | translate }}</span>

          </div>
        </dx-tab-panel>

      </as-split-area>
      <as-split-area [size]="54" [minSize]="30">
        <div class="logic-area">
          @if (pages) {
            <div class="page-tabs" role="tablist">
              @for (page of pages; track page.ObjId) {
                <button type="button" role="tab" class="page-tab" [class.active]="selectedPage?.ObjId == page.ObjId"
                  [attr.aria-selected]="selectedPage?.ObjId == page.ObjId" (click)="selectLogicPage(page)">
                  {{ page.Name }}
                </button>
              }
            </div>
          }
          <div class="logic-canvas">
            @for (page of pages; track page.ObjId) {
              @if (selectedPage?.ObjId == page.ObjId) {
                <p3-ruleeditor
                  (selectedItemsChanged)="onSelectedItemsChanged($event)"
                  (removeSelectedItem)="removeSelectedItem($event)" [page]="page" id="{{page.ObjId}}"
                  name="{{page.Name}}" [isLoading]="isLoading"></p3-ruleeditor>
              }
            }
          </div>
        </div>
      </as-split-area>
      <as-split-area [size]="24" [minSize]="18">
        <p3-propertyeditor #propertyEditor (validate)="validate($event)" (scan)="scan($event)"
          (fileUploaded)="fileUploaded($event)" [userGroups]="userGroups" [item]="selectedItem"
          [areaInstances]="areaInstances" [categoryInstances]="categoryInstances"
          (saveLearnedNodes)="saveLearnedNodes($event)" (unselectItem)="unselectItem()" (onChanged)="onPropertyChanged($event)"
        [isLoading]="isLoading" [loaded]="loaded"></p3-propertyeditor>
      </as-split-area>

    </as-split>
  </div>
</div>



<dx-popup #infoPopup [width]="'300px'" [height]="'300px'" [showTitle]="true" [hideOnOutsideClick]="true"
  [title]="'COMMON.INFO' | translateAsync" [(visible)]="infoPopupVisible" (onHiding)="onPopupHiding($event)">
  <div *dxTemplate="let data of 'content'">
    TODO!
  </div>
</dx-popup>
