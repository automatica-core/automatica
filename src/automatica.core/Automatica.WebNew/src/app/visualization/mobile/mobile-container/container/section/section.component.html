<section class="section_view" [attr.aria-label]="title | translateAsync">
  <div class="section_header">
    <h2 class="section_title">{{ title | translateAsync }}</h2>
    <button type="button" class="section_refresh" (click)="onRefresh($event)"
      [attr.aria-label]="'UI.VISU.REFRESH' | translateAsync" [attr.title]="'UI.VISU.REFRESH' | translateAsync">
      <fa-icon icon="rotate-right"></fa-icon>
    </button>
  </div>

  <div class="sections_rows">
    @for (item of items; track item) {
      <app-visualization-element [pageGroupType]="pageGroupType" [item]="item"></app-visualization-element>
    }
  </div>
</section>
