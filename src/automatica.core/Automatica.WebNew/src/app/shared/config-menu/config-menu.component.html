<dx-menu #menu [items]="menuItems" itemsExpr="items" displayExpr="label" [showFirstSubmenuMode]="true" orientation="horizontal"
    submenuDirection="auto" [hideSubmenuOnMouseLeave]="false" (onItemClick)="itemClick($event)">
</dx-menu>

@if (blockPickerAnchor) {
    <p3-logic-block-picker [templates]="ruleTemplates" [anchorElement]="blockPickerAnchor"
        (pick)="addRuleFromPicker($event)" (close)="closeBlockPicker()"></p3-logic-block-picker>
}
