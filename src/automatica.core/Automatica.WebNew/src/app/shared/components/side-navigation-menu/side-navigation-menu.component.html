<ng-content></ng-content>


<div class="menu-container">
  @if (items && items.length > 0) {
    <dx-scroll-view height="100vh" style="background-color: #363640;">
      <dx-tree-view expandEvent="click" [items]="items" (onInitialized)="onMenuInitialized($event)"
        (onItemClick)="onItemClick($event)" (onContentReady)="updateSelection($event)"
        (onSelectionChanged)="updateSelection($event)" [selectByClick]="true" selectionMode="single"
        keyExpr="path" [style.padding-bottom]="'120px'" [style.background-color]="'#363640'">
        <div *dxTemplate="let data of 'item'" style="background-color: #363640;">
          @if (data.seperator) {
            <span title="{{data.text | translateAsync}}">{{data.text | translateAsync}}</span>
          }
          @if (!data.seperator) {
            <fa-icon title="{{data.text | translateAsync}}" [fixedWidth]="true" [icon]="data.icon">
            </fa-icon>
            <span title="{{data.text | translateAsync}}" class="nav-padding">{{data.text |
            translateAsync}}</span>
          }
        </div>
      </dx-tree-view>
    </dx-scroll-view>
  }
  @if (!items || items.length == 0) {
    <dx-load-indicator height="30" width="30"></dx-load-indicator>
  }
</div>
