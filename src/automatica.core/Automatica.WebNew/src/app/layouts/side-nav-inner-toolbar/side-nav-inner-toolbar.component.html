<div class="shell" [class.mobile]="isMobileLayout" [class.menu-open]="mobileOpen" [class.animated]="animated">
  <app-side-navigation-menu class="side" [items]="menuItems" [compactMode]="!isMobileLayout && collapsed"
    (navigated)="onNavigated()" (expandRequested)="setCollapsed(false)">
    @if (!isMobileLayout) {
      <button type="button" class="collapse" (click)="setCollapsed(!collapsed)"
        [attr.title]="(collapsed ? 'UI.NAV.EXPAND' : 'UI.NAV.COLLAPSE') | translateAsync"
        [attr.aria-label]="(collapsed ? 'UI.NAV.EXPAND' : 'UI.NAV.COLLAPSE') | translateAsync">
        <fa-icon [icon]="collapsed ? 'angles-right' : 'angles-left'"></fa-icon>
      </button>
    }
  </app-side-navigation-menu>

  @if (isMobileLayout && mobileOpen) {
    <div class="scrim" (click)="mobileOpen = false"></div>
  }

  <div class="main">
    <app-header [menuToggleEnabled]="isMobileLayout" (menuToggle)="mobileOpen = !mobileOpen"></app-header>
    <div class="content">
      <ng-content></ng-content>
    </div>
  </div>
</div>
