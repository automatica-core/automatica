trigger:
  - master  
  - develop
# no PR builds: they would run with the pipeline secrets (variable group) for fork code
pr: none
  
pool:
  vmImage: ubuntu-latest

variables:
  - group: automatica.core.8
  # buildx would push the per-arch tags as manifest lists, which breaks 'docker manifest create'
  - name: BUILDX_NO_DEFAULT_ATTESTATIONS
    value: '1'

steps:
- task: UseDotNet@2
  inputs:
    packageType: 'sdk'
    version: '$(SDK_VERSION)'

- task: Bash@3
  displayName:  Install tools
  inputs:
    targetType: 'inline'
    script: |
      dotnet tool install automatica-cli  --global  2>/dev/null
      dotnet tool update automatica-cli -g  2>/dev/null

- task: DotNetCoreCLI@2
  displayName: Restore
  inputs:
    command: 'restore'
    projects: '**/*.csproj'
    
    

- task: DotNetCoreCLI@2
  displayName: Test
  inputs:
    command: 'test'
    projects: '**/*[Tt]ests.csproj'
    arguments: '--configuration $(BuildConfiguration) -l trx  /p:CollectCoverage=true /p:CoverletOutputFormat="opencover"'

- task: AutomaticaCorePluginCli@9
  displayName: Plugin build
  inputs:
    manifest_path: 'P3.Driver.FroniusSolarFactory/automatica-manifest.json'
    version: '$(AUTOMATICA_VERSION).$(Build.BuildId)'
    api_key: '$(CLOUD_API_KEY)'
    cloud_url: '$(CLOUD_URL)'
    configuration: 'Debug$(BuildConfiguration)'
    publish: true
    dockerize: true
    outputdirectory: '$(build.artifactstagingdirectory)'

- task: AutomaticaCoreDockerMultiArchCli@9
  displayName: Docker multi-arch
  inputs:
    dockerRegistryEndpoint: 'DockerHub'
    dockerfile_amd64: 'Dockerfile'
    dockerfile_arm32: 'Dockerfile.arm32'
    imageName: 'automaticacore/plugin-p3.driver.froniussolar'
    buildArgs: |
      MANIFEST_DIR=P3.Driver.FroniusSolarFactory/
      VERSION=$(AUTOMATICA_VERSION).$(Build.BuildId)
      CONFIG=$(BuildConfiguration)
    version: '$(AUTOMATICA_VERSION).$(Build.BuildId)'

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'drop'
    publishLocation: 'Container'
  
  